<div class="container py-4">
<h1 class="mb-4">Personajes de Rick and Morty</h1>
<div class="input-group mb-4">

<input class="form-control" placeholder="Buscar por nombre..."
[(ngModel)]="busqueda" (keyup.enter)="buscar()">
<button class="btn btn-primary" (click)="buscar()">Buscar</button>
</div>
@if (cargando()) {
<p>Cargando...</p>
} @else if(hayError()) {
    <p class="text-danger">No se pudo conectar con la API. Revisá la conexión a
internet.</p>
    }@else{
<div class="row g-3">
@for (p of personajes(); track p.id) {
<div class="col-6 col-md-3">
<app-personaje-card [personaje]="p" />
</div>
} @empty {
<p>No se encontró ningún personaje.</p>
}
</div>

}

</div>
